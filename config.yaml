# config.yaml
# 检索权重配置
retrieval:
  weights:
    keyword_heavy: [0.75, 0.25]   # [bm25, dense]
    semantic_heavy: [0.40, 0.60]
    balanced: [0.65, 0.35]

  boost_keywords:
    high: ["招标编号", "项目编号", "标段", "分包", "招标项目编号", "采购项目编号"]
    medium: ["资质要求", "业绩要求", "注册资本", "建造师", "评标办法", "限价", "招标控制价", "保证金", "投标保证金", "资格条件", "资质等级"]
    low: ["投标人", "招标人", "开标时间", "截止时间", "递交截止", "投标截止"]

  regulation_keywords:
    high: ["民法典", "招标投标法", "政府采购法", "招标投标法实施条例"]
    medium: ["管理办法", "指导意见", "通知", "规定"]

  penalty_patterns:
    - [ "^第[一二三四五六七八九十]+页$", -0.2, "页码" ]
    - [ "^\\s*目录\\s*$", -0.2, "目录" ]
    - [ "^[（(]?\\d+[）)]?\\s*$", -0.2, "纯数字" ]
    - [ "(版权所有|All Rights Reserved)", -0.15, "版权声明" ]
  keyword_heavy_patterns:
    - "第\\d+条"
    - "编号|标段|资质|建造师|注册资本"
    - "限价|保证金|资格条件"

  semantic_heavy_patterns:
    - "什么是|是什么|定义|解释|含义|概念|意思"
    - "如何|怎么|怎样|步骤|流程|操作|办理"
    - "背景|原因|目的|意义|解读|分析"
    - "区别|不同|对比|比较"
    - "串通|围标|陪标|挂靠"
    - "投标人|招标人|评标"

# 意图分类配置
intent:
  greeting_responses:
    "你好": "您好！我是招投标智能助手，可以为您解答招标投标、政府采购相关的法规政策问题。请问有什么可以帮您？"
    "您好": "您好！请问有什么招投标方面的问题可以帮您？"
    "hi": "Hello！我是招投标智能助手，有什么可以帮您？"
    "hello": "Hello！请问您想了解招标投标的哪方面内容？"
    "在吗": "在的，请问有什么可以帮您？"
    "谢谢": "不客气，有问题随时问我！"
    "感谢": "不客气！"
    "再见": "再见！如有问题，随时回来咨询。"

  greeting_keywords:
    - "你好"
    - "您好"
    - "hi"
    - "hello"
    - "嗨"
    - "在吗"
    - "在不在"
    - "有人吗"

  thanks_keywords:
    - "谢谢"
    - "感谢"
    - "thanks"
    - "thank"

  goodbye_keywords:
    - "再见"
    - "拜拜"
    - "bye"
    - "goodbye"

  unrelated_keywords:
    - "天气"
    - "气温"
    - "下雨"
    - "晴天"
    - "台风"
    - "温度"
    - "股票"
    - "基金"
    - "理财"
    - "投资"
    - "涨跌"
    - "股价"
    - "美食"
    - "餐厅"
    - "好吃"
    - "外卖"
    - "菜谱"
    - "电影"
    - "电视"
    - "综艺"
    - "娱乐"
    - "明星"
    - "八卦"
    - "游戏"
    - "足球"
    - "篮球"
    - "体育"
    - "比赛"
    - "比分"

  bidding_keywords:
    - "招标"
    - "投标"
    - "采购"
    - "围标"
    - "串标"
    - "中标"
    - "标书"
    - "标段"
    - "评标"
    - "开标"






# 检索配置
retriever:
  top_k: 5
  vector_recall: 20
  summarize_max_chunks: 8
  article_match_top_k: 3



pdf:
  # 文档标题匹配规则
  document_title_patterns:
    - "^中华人民共和国"
    - "[法条例规定办法意见通知批复函]$"
    - "^关于.*[通知意见函]$"

  # 需要排除的文档关键词
  exclude_doc_keywords:
    - "目录"
    - "编辑出版说明"
    - "图书在版编目"
    - "CIP"
    - "ISBN"
    - "总目录"
    - "资料补充栏"
    - "前言"
    - "编写说明"
    - "出版说明"
    - "索引"
    - "附录"
    - "附件"
    - "附表"
    - "格式"
    - "样板"

  # 需要排除的内容关键词
  exclude_content_keywords:
    - "审计法"
    - "预算法"
    - "价格法"
    - "公证法"
    - "行政处罚法"
    - "残疾人"
    - "中小企业"
    - "脱贫攻坚"
    - "扶贫"

  # 需要按法条切分的关键词
  split_by_article_keywords:
    - "法"
    - "条例"
    - "规定"
    - "办法"
    - "规范"
    - "细则"

  # 需要整体保留的关键词
  keep_as_whole_keywords:
    - "通知"
    - "意见"
    - "批复"
    - "函"
    - "复函"

  # PDF显式配置：每个PDF必须在此指定切分模式和作者
  # key = PDF文件名（不含.pdf后缀），chunk_mode = law_article | sliding
  pdf_metadata:
    "中华人民共和国招标投标法律法规全书：含相关政策 (法律法规出版社法规中心) (Z-Library)(OCR)":
      author: "法律法规出版社"
      chunk_mode: "law_article"
    "招标投标法律解读与风险防范实务 (白如银) (Z-Library)":
      author: "白如银"
      chunk_mode: "sliding"
# 应用配置
app:
  title: "招投标RAG+ReAct Agent"
  version: "2.1.0"
  description: "招投标法规智能问答系统"

# 响应消息配置
responses:
  unrelated: "抱歉，我只能回答招标投标相关的问题。请提问与招投标、政府采购法律法规相关的内容。"
  no_results: "抱歉，根据现有知识库未找到相关信息。"

# ReAct Agent配置
react_agent:
  max_steps: 5
  temperature: 0.3
  max_tokens: 1000
#genator大模型生成配置
llm:
  max_tokens: 2000

# 服务配置
server:
  host: "0.0.0.0"
  port: 8000
  debug: true

#会话管理配置
session:
  # 会话 TTL（秒），默认 7 天
  ttl_seconds: 604800
  # 每个会话最大消息数（超过后自动截断）
  max_messages_per_session: 30
  # 清理检查间隔（秒），默认 1 小时
  cleanup_interval_seconds: 3600

