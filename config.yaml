question_rewriter:
  # 功能开关
  enable_colloquial_to_formal: true
  enable_redundancy_removal: true
  enable_synonym_expansion: true

  # 口语转书面语映射表
  colloquial_mappings:
    "咋": "怎么"
    "啥": "什么"
    "干嘛": "做什么"
    "咋样": "怎么样"
    "咋办": "怎么办"
    "搞": "进行"
    "弄": "处理"
    "整": "进行"
    "有没有": "是否有"
    "有没": "是否有"
    "帮我看": "查询"
    "帮我查": "查询"
    "告诉我": "请说明"
    "讲一下": "请说明"
    "说说": "请说明"
    "想问问": "请问"
    "问一下": "请问"
    "多少": "什么"
    "几条": "哪些"
    "啥时候": "什么时间"
    "哪条": "哪一条"
    "咋回事": "是怎么回事"
    "为啥": "为什么"
    "为啥子": "为什么"
    "咋个": "怎么"

  # 冗余短语（直接删除）
  redundant_phrases:
    - "我想问一下"
    - "我想请问"
    - "我想知道"
    - "请问一下"
    - "帮我查一下"
    - "帮我看看"
    - "我想了解一下"
    - "麻烦问一下"
    - "能不能告诉我"
    - "可以告诉我"
    - "请问您"
    - "请问你"

  # 冗余正则模式
  redundancy_patterns:
    - "(请问){2,}"
    - "(你好){2,}"
    - "(那个){2,}"
    - "(这个){2,}"
    - "就是+"
    - "那个"
    - "这个"
    - "然后"
    - "那个那个"

  # 行业同义词映射（口语 → 标准专业术语）
  synonym_mappings:
    # 违规行为
    "串标": "串通投标"
    "围标": "串通投标"
    "陪标": "串通投标"
    "挂靠": "借用资质"
    "借资质": "借用资质"
    "买标": "串通投标"
    "卖标": "串通投标"

    # 评标相关
    "打分": "评标"
    "打分办法": "评标办法"
    "评分标准": "评标办法"
    "评标方式": "评标办法"

    # 价格相关
    "拦标价": "招标控制价"
    "最高限价": "招标控制价"
    "底价": "招标控制价"
    "保函": "投标保证金"

    # 资格相关
    "资格": "资格条件"
    "资质": "资格条件"

    # 法规名称
    "招投标法": "招标投标法"
    "招标法": "招标投标法"
    "投标法": "招标投标法"
    "采购法": "政府采购法"
